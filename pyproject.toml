[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zha-z2m-converters"
version = "0.1.0"
description = "Safe declarative bridge from zigbee-herdsman-converters to ZHA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parser = [
    "tree-sitter>=0.24",
    "tree-sitter-typescript>=0.23",
]
test = ["pytest>=8"]

[project.scripts]
zha-z2m-converters = "zha_z2m_converters.cli:main"
zha-z2m-converters-coverage = "zha_z2m_converters.coverage:main"

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
zha_z2m_converters = ["py.typed", "manifest.json", "strings.json", "translations/*.json"]
