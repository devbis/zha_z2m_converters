[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zha-zigbee-herdsman-converters"
version = "0.1.0"
description = "Safe declarative bridge from zigbee-herdsman-converters to ZHA"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parser = [
    "tree-sitter>=0.24",
    "tree-sitter-typescript>=0.23",
]
test = ["pytest>=8"]

[project.scripts]
zha-zhc = "zha_zhc.cli:main"
zha-zhc-coverage = "zha_zhc.coverage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zha_zhc = ["py.typed", "manifest.json"]
